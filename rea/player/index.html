<style>

#stage:after{background-image:linear-gradient(#cfe6ff1c 1px,transparent 1px),linear-gradient(90deg,#cfe6ff1c 1px,transparent 1px);background-size:120px 120px}
.mono{font-family:"Lesson Mono","Lesson Sans",monospace}
#eyebrow{position:absolute;left:96px;top:54px;font-size:24px;letter-spacing:4px;color:#8fd0ff}
#heading{position:absolute;left:96px;top:96px;width:1200px;margin:0;font-size:72px;font-weight:700;line-height:1.5;z-index:2}

body.export #shell{padding:0;max-width:none}body.export #viewport{border-radius:0;box-shadow:none}

<div id="shell">

<script>
// Every visible state is a pure function of frame, narration locale, subtitle pair and the target selection.
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),NS='http://www.w3.org/2000/svg';
const exporting=params.get('export')==='1';if(exporting)document.body.classList.add('export');
const SUBS=['en-US','vi-VN','ja-JP'];
let project,frame=0,locale=params.get('locale')||'zh-TW',subs=SUBS.includes(params.get('captions'))?params.get('captions'):'en-US',
  playing=false,captionOn=!exporting||SUBS.includes(params.get('captions')),target='native',last=0,audio=new Audio(),audioReady=false;
const clamp=x=>Math.min(1,Math.max(0,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},outCubic=x=>1-Math.pow(1-clamp(x),3),mix=(a,b,k)=>a+(b-a)*k;
const SEC={origin:'起源',principle:'原理',comparison:'比較',application:'應用',outlook:'展望'};
const NOTE={s01:'資料：git 紀錄',s02:'資料：git 紀錄',s03:'示意',s04:'示意',s05:'示意，非真實比例',s06:'示意',s07:'定性比較',s08:'本片實測＋參考影片',s09:'示意',s10:'截至 2026-10-17',s11:'示意'};
const TARGETS={
  native:{detail:'Ghidra・Hopper・IDA・JADX',feedback:'原生程式需要反編譯引擎：REA 會呼叫 Ghidra、Hopper 或 IDA 把機器碼還原成偽程式碼。'},
  electron:{detail:'REA 內建 JavaScript 分析',feedback:'Electron App 是打包好的 JavaScript：REA 直接讀模組與 IPC 關係，不必動用反編譯器。'},
  web:{detail:'瀏覽器觀察：結構・腳本・請求',feedback:'網頁看頁面結構、載入的腳本與網路請求，用 Chrome 系瀏覽器觀察即可。'},
  cloud:{detail:'✕ 伺服器端程式不在你手上',feedback:'核心邏輯在遠端伺服器：本機抓得到請求和回應，拿不到後端程式——這在 REA 的能力邊界外。'}};

// ---------- SVG helpers ----------
const svg=$('diagram');
function E(tag,attrs={},parent=svg){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);parent.append(n);return n}
function G(parent,attrs={}){return E('g',attrs,parent)}
function T(parent,x,y,str,cls='ink t30',attrs={}){const n=E('text',{x,y,class:cls,...attrs},parent);n.textContent=str;return n}
function lines(parent,x,y,arr,cls,lh,attrs={}){return arr.map((s,i)=>T(parent,x,y+i*lh,s,cls,attrs))}
function R(parent,x,y,w,h,cls='panel',rx=10){return E('rect',{x,y,width:w,height:h,rx,class:cls},parent)}
function corners(parent,x,y,w,h){const d=14;E('path',{class:'line','stroke-width':3,d:`M${x},${y+d}V${y}H${x+d}M${x+w-d},${y}H${x+w}V${y+d}M${x+w},${y+h-d}V${y+h}H${x+w-d}M${x+d},${y+h}H${x}V${y+h-d}`},parent)}
function arrowHead(parent,x,y,ang,color='#ffc857',size=14){const a=ang*Math.PI/180,p=(r,da)=>[x-size*Math.cos(a+da),y-size*Math.sin(a+da)];const [x1,y1]=p(0,.45),[x2,y2]=p(0,-.45);return E('path',{d:`M${x1},${y1}L${x},${y}L${x2},${y2}`,fill:'none',stroke:color,'stroke-width':3.5,'stroke-linejoin':'round'},parent)}
function show(node,v,dy=14){node.style.opacity=v;node.style.transform=`translate(0px,${((1-v)*dy).toFixed(2)}px)`}
function draw_line(path,v){const L=path.getTotalLength?path.getTotalLength():1000;path.style.strokeDasharray=`${L} ${L}`;path.style.strokeDashoffset=String(L*(1-v))}
const qa=(node,id,group)=>{node.dataset.b=id;if(group)node.dataset.og=group;return node};

// ---------- scene builders ----------
// Each builder returns draw(c) where c.p(i,dur,delay) is the eased progress of beat i (meaning unit i).
const BUILD={};

BUILD.s01=g=>{
  const days=[1,1,6,105,176,195,134,366,258,307,167,332,296,154,114,74];
  const chart=qa(G(g),'s01-chart','s01-chart');T(chart,40,40,'每日提交數・2026 年 10 月 2–17 日','dim t26');
  E('line',{x1:40,y1:560,x2:780,y2:560,class:'line'},chart);
  const bars=days.map((v,i)=>E('rect',{x:52+i*46,width:30,y:560,height:0,fill:'#8fd0ff'},chart));
  [0,3,6,9,12,15].forEach(i=>T(chart,67+i*46,596,`10/${i+2}`,'dim t26',{'text-anchor':'middle'}));
  T(chart,52+13*46+15,90,'10/15 宣布 25 萬星','amber t26',{'text-anchor':'middle'});
  const mark=E('line',{x1:52+13*46+15,y1:100,x2:52+13*46+15,y2:540,class:'dash'},chart);
  const counter=qa(G(g),'s01-counter');const num=T(counter,900,120,'0','amber b',{style:'font-size:104px'});T(counter,904,170,'GitHub 星星（README 里程碑）','dim t26');
  const word=qa(G(g),'s01-word');T(word,900,320,'REA','ink b',{style:'font-size:116px'});
  const exp=T(word,1170,300,'','ink t40');[['R','everse '],['E','ngineer '],['A','nything']].forEach(([a,b])=>{const s1=E('tspan',{class:'amber b'},exp);s1.textContent=a;const s2=E('tspan',{},exp);s2.textContent=b});
  const meaning=T(word,1172,350,'逆向工程任何東西','green t34 b');
  const cards=[['老遊戲的玩法','→ 用 Rust 重寫','game'],['射擊遊戲第 1 關','→ 搬上網頁','web']].map(([a,b,kind],i)=>{const c=qa(G(g),'s01-card'+i),x=900+i*420;R(c,x,410,390,190);
    if(kind==='game'){E('rect',{x:x+24,y:450,width:110,height:64,rx:30,class:'line'},c);E('path',{class:'line',d:`M${x+50},482h24M${x+62},470v24`},c);E('circle',{cx:x+106,cy:474,r:6,class:'line'},c);E('circle',{cx:x+118,cy:488,r:6,class:'line'},c)}
    else{E('rect',{x:x+24,y:440,width:110,height:84,rx:8,class:'line'},c);E('line',{x1:x+24,y1:460,x2:x+134,y2:460,class:'line'},c);E('path',{class:'line',d:`M${x+44},505l18-22l18,14l22-26`},c)}
    T(c,x+152,476,a,'ink t28 b');T(c,x+152,518,b,'green t28');T(c,x+24,572,'社群 Demo（參考影片）','dim t26');return c});
  const stamp=qa(G(g,{transform:'rotate(-5 410 250)'}),'s01-stamp','s01-chart');R(stamp,180,190,470,110,'panel-hi');T(stamp,415,236,'故事的起點','amber t28',{'text-anchor':'middle'});T(stamp,415,282,'2026-04-14','amber b mono',{'text-anchor':'middle',style:'font-size:44px'});
  return c=>{
    bars.forEach((b,i)=>{const k=outCubic(c.p(0,1.2,i*.05));const h=days[i]/366*400*k;b.setAttribute('y',560-h);b.setAttribute('height',h);b.style.fill=i===13&&c.p(1)>0?'#ffc857':'#8fd0ff'});
    show(chart,c.p(0,.6));mark.style.opacity=c.p(1);
    show(counter,c.p(1));num.textContent=Math.round(250000*outCubic(c.p(1,1.4))).toLocaleString('en-US')+(c.p(1,1.4)>=1?'+':'');
    show(word,c.p(2));meaning.style.opacity=c.p(3);
    cards.forEach((k,i)=>show(k,c.p(4+i),24));
    show(stamp,c.p(6),-20);if(c.p(6)>0){chart.style.opacity=mix(1,.35,c.p(6))}
  }};

BUILD.s02=g=>{
  const X=d=>80+d/213*1570;
  const axis=qa(G(g),'s02-axis','s02-axis');E('line',{x1:80,y1:60,x2:1650,y2:60,class:'line'},axis);
  ['4月','5月','6月','7月','8月','9月','10月'].forEach((m,i)=>{const d=[0,30,61,91,122,153,183][i];E('line',{x1:X(d),y1:52,x2:X(d),y2:68,class:'line'},axis);T(axis,X(d)+6,40,m,'dim t26')});
  const ms=(d,lbl,cls,anchor='start',dy=110)=>{const n=G(g);E('path',{d:`M${X(d)},48l12,12l-12,12l-12-12z`,fill:'#ffc857'},n);T(n,X(d)+(anchor==='end'?12:-12),dy,lbl,cls,{'text-anchor':anchor});return qa(n,'s02-'+d,'s02-axis')};
  const m1=ms(13,'2026-04-14 首次提交','amber t30 b'),name=qa(T(g,68,150,'betterBinaryMCP','ink t30 mono'),'s02-name');
  const hopper=qa(G(g),'s02-hopper');R(hopper,68,170,330,46,'panel');T(hopper,84,203,'讓 AI 操作 Hopper','ink t26');
  const m2=ms(102,'07-12 改名 REA・發布 npm','amber t30 b');
  const scope=qa(G(g),'s02-scope');T(scope,820,162,'原生程式 → 網頁 → 桌面 App → 手機 App','green t26');
  const m3=ms(188,'10 月登上熱門榜','amber t30 b','end');
  const chart=qa(G(g),'s02-chart','s02-chart');T(chart,80,262,'每月提交數（10 月統計至 17 日）','dim t26');E('line',{x1:80,y1:560,x2:1650,y2:560,class:'line'},chart);
  const data=[['4月',15,1],['7月',106,697],['8月',137,21],['9月',167,100],['10月',198,2686]];
  const bars=data.map(([m,d,v])=>{const r=E('rect',{x:X(d)-50,width:100,y:560,height:0,fill:'#8fd0ff'},chart);const t=T(chart,X(d),550,v.toLocaleString('en-US'),'ink t28 b mono',{'text-anchor':'middle'});T(chart,X(d),596,m,'dim t26',{'text-anchor':'middle'});return{r,t,v}});
  const reasons=[['一句話就說得懂','看到喜歡的功能，叫 AI 拆給你看'],['戳中一個焦慮','什麼都拆得開，軟體公司守得住嗎？']].map(([a,b],i)=>{const c=qa(G(g),'s02-reason'+i,'s02-chart'),x=120+i*760;R(c,x,300,700,190,i?'panel-bad':'panel-hi');T(c,x+34,360,(i?'② ':'① ')+a,(i?'red':'amber')+' t34 b');T(c,x+34,420,b,'ink t30');T(c,x+34,462,'爆紅原因','dim t26');return c});
  const beatFor=[1,4,5,5,6];
  return c=>{
    show(axis,c.p(0,.6));show(m1,c.p(1));show(name,c.p(2));show(hopper,c.p(3));show(m2,c.p(4));show(scope,c.p(5));show(m3,c.p(6));
    show(chart,c.p(1));
    bars.forEach((b,i)=>{const k=outCubic(c.p(beatFor[i],1.2,i===2?.3:i===3?.6:0));const h=b.v/2686*230*k;b.r.setAttribute('y',560-h);b.r.setAttribute('height',h);b.t.setAttribute('y',548-h);b.t.style.opacity=k;b.r.style.fill=i===4?'#ffc857':'#8fd0ff'});
    const dimmed=c.p(7);chart.style.opacity=Math.min(c.p(1),mix(1,.1,dimmed));
    reasons.forEach((r,i)=>show(r,c.p(7+i),24));
  }};

BUILD.s03=g=>{
  const box=(x,w,title,cls='panel')=>{const n=G(g);R(n,x,40,w,170,cls);T(n,x+w/2,80,title,'ink t30 b',{'text-anchor':'middle'});return n};
  const src=qa(box(40,300,'原始碼'),'s03-src');lines(src,64,124,['// 搜尋筆記','find(query) {','  match(query)'],'green t26 mono',30);
  const comp=qa(box(430,260,'編譯器'),'s03-comp');const gear=G(comp,{transform:'translate(560,150)'});E('circle',{r:34,class:'line'},gear);for(let k=0;k<8;k++)E('rect',{x:-6,y:-46,width:12,height:14,fill:'#cfe6ff',transform:`rotate(${k*45})`},gear);E('circle',{r:12,class:'line'},gear);
  const bin=qa(box(780,300,'機器碼'),'s03-bin');lines(bin,800,124,['55 48 89 E5 48 83','EC 20 89 7D EC 8B','45 EC 0F AF C0 C9'],'dim t26 mono',30);
  const app=qa(box(1170,260,'App 成品'),'s03-app');E('path',{class:'line',d:'M1260,110l40-20l40,20v60l-40,20l-40-20zM1260,110l40,20l40-20M1300,130v60'},app);
  const arrows=[[340,430],[690,780],[1080,1170]].map(([a,b])=>{const n=G(g);E('line',{x1:a+8,y1:125,x2:b-10,y2:125,stroke:'#cfe6ff','stroke-width':3},n);arrowHead(n,b-8,125,0,'#cfe6ff');return n});
  const lost=['// 註解','query','match'].map((s,i)=>{const n=G(g);T(n,0,0,s,'amber t26 mono');T(n,0,30,'✕ 丟失','red t26');return n});
  const sign=qa(G(g),'s03-sign');R(sign,1470,60,230,110,'panel-bad');T(sign,1585,105,'單行道','red t34 b',{'text-anchor':'middle'});T(sign,1585,148,'資訊只出不回','ink t26',{'text-anchor':'middle'});
  const rev=G(g);const rp=E('path',{d:'M1300,232 C1300,300 230,300 190,240',class:'arrow','stroke-dasharray':'14 10'},rev);arrowHead(rev,190,240,235);qa(T(rev,745,320,'逆向工程：從成品倒推回去','amber t34 b',{'text-anchor':'middle'}),'s03-rev');
  const study=['結構','資料怎麼流動','邏輯怎麼運作'].map((s,i)=>{const n=qa(G(g),'s03-study'+i);const x=40+i*270;R(n,x,370,250,62,'panel');T(n,x+125,412,s,'ink t28',{'text-anchor':'middle'});return n});

  const watch=qa(G(g),'s03-watch');T(watch,1450,330,'沒有設計圖的機械錶','ink t28',{'text-anchor':'middle'});

// ---------- runtime ----------
const sceneUI={};
function build(){for(const s of project.variants['zh-TW'].scenes){if(s.section==='credit')continue;const g=G(svg,{id:'scene-'+s.id});g.style.display='none';sceneUI[s.id]={g,draw:BUILD[s.id](g)}}}
function scale(){if(!project)return;const s=exporting?1:Math.min(1,$('shell').clientWidth/project.width);$('stage').style.transform='scale('+s+')';$('viewport').style.width=project.width*s+'px';$('viewport').style.height=project.height*s+'px'}
function currentScene(t){return project.variants[locale].scenes.find(s=>t>=s.start&&t<s.end)||project.variants[locale].scenes.at(-1)}
function setAudio(){audio.pause();const m=project.variants[locale].mix;audioReady=!!m;if(m)audio.src=new URL('../'+m,location.href).href;else audio.removeAttribute('src');audio.load()}
function chapters(){const sel=$('chapters');sel.replaceChildren();for(const s of project.variants[locale].scenes){const o=document.createElement('option');o.value=s.start;o.textContent=s.title||'片尾';sel.append(o)}}
async function loadFonts(){const assets=project.font_assets||[];for(const a of assets){const url=new URL('../'+a.url,location.href);const face=new FontFace(a.family,'url('+JSON.stringify(url.href)+')');try{document.fonts.add(await face.load())}catch{throw Error('Required font could not load: '+a.family)}}await document.fonts.ready}
function draw(){const t=frame/project.fps,s=currentScene(t),credit=s.section==='credit';
  $('heading').textContent=s.title||'';$('subheading').textContent=s.screen||'';
  for(const id of ['heading','subheading','visual','titleblock','eyebrow'])$(id).style.display=credit?'none':'';
  $('credit').style.display=credit?'flex':'none';
  for(const id in sceneUI)sceneUI[id].g.style.display=id===s.id?'':'none';
  if(!credit){const n=project.variants[locale].scenes.indexOf(s)+1;$('eyebrow').textContent=`第 ${n} 幕 ／ ${SEC[s.section]}`;$('tb-no').textContent='REA-'+String(n).padStart(2,'0');$('tb-note').textContent=NOTE[s.id]||'示意';
    const beats=s.phases.filter(p=>p.name[0]==='b'),at=i=>beats[i]?t-beats[i].start:-1e9;
    sceneUI[s.id].draw({t,local:t-s.start,at,p:(i,d=.7,delay=0)=>smooth((at(i)-delay)/d)})}
  const cue=project.variants[locale].subtitles.cues.find(c=>t>=c.start&&t<c.end);
  $('caption').style.display=cue&&captionOn&&!credit?'flex':'none';$('caption1').textContent=cue?.text['zh-TW']||'';$('caption2').textContent=cue?.text[subs]||'';$('caption2').lang=subs.slice(0,2);
  $('progress-mark').style.width=100*t/project.duration+'%';$('seek').value=frame;$('time').textContent=t.toFixed(1)+' / '+project.duration+' s';$('chapters').value=s.start;
  $('feedback').textContent=TARGETS[target].feedback;
}
async function seekToFrame(n,language=locale){if(!project.variants[language])throw Error('Unknown locale');if(language!==locale){locale=language;$('locale').value=locale;chapters();setAudio()}frame=Math.max(0,Math.min(Math.round(project.duration*project.fps)-1,Math.round(n)));draw();if(!exporting&&audioReady&&Math.abs(audio.currentTime-frame/project.fps)>.15)audio.currentTime=frame/project.fps;return frame}
function pause(){playing=false;audio.pause();$('play').textContent='播放'}
async function play(){if(frame>=project.duration*project.fps-1)await seekToFrame(0);playing=true;last=performance.now();$('play').textContent='暫停';if(audioReady){audio.currentTime=frame/project.fps;try{await audio.play()}catch{pause();$('feedback').textContent='音軌無法播放，請檢查音檔或瀏覽器權限。';return}}requestAnimationFrame(tick)}
function tick(now){if(!playing)return;const next=audioReady?Math.floor(audio.currentTime*project.fps):frame+(now-last)*project.fps/1000;last=now;if(next>=project.duration*project.fps){seekToFrame(project.duration*project.fps-1);pause();return}frame=next;draw();requestAnimationFrame(tick)}
audio.addEventListener('ended',()=>{if(playing){seekToFrame(project.duration*project.fps-1);pause()}});
function box(node,id){const r=node.getBoundingClientRect(),b=$('stage').getBoundingClientRect(),s=b.width/project.width;return{id,x:(r.x-b.x)/s,y:(r.y-b.y)/s,width:r.width/s,height:r.height/s,container:'visual'}}
window.lesson={ready:async()=>{await loaded;await document.fonts.ready},seekToFrame,getProject:()=>project,
  bounds:()=>{if($('visual').style.display==='none')return[];const s=currentScene(frame/project.fps),ui=sceneUI[s.id];if(!ui)return[];
    return[...ui.g.querySelectorAll('[data-b]')].filter(n=>+getComputedStyle(n).opacity>0.01&&n.getBoundingClientRect().width>0).map(n=>{const o=box(n,n.dataset.b);if(n.dataset.og)o.overlapGroup=n.dataset.og;return o})}};
const loaded=(async()=>{const res=await fetch('../project.json');if(!res.ok)throw Error('Cannot load project.json');project=await res.json();if(!project.variants[locale])throw Error('Unknown locale');await loadFonts();build();$('stage').style.width=project.width+'px';$('stage').style.height=project.height+'px';$('seek').max=Math.round(project.duration*project.fps)-1;$('locale').value=locale;$('subs').value=subs;$('target').value=target;chapters();setAudio();scale();await seekToFrame(0)})();
$('play').onclick=()=>playing?pause():play();$('replay').onclick=async()=>{pause();await seekToFrame(0);await play()};
$('seek').oninput=()=>{pause();seekToFrame(Number($('seek').value))};$('locale').onchange=()=>{pause();seekToFrame(frame,$('locale').value)};
$('subs').onchange=()=>{subs=$('subs').value;draw()};$('chapters').onchange=()=>{pause();seekToFrame(Number($('chapters').value)*project.fps)};
$('captions').onclick=()=>{captionOn=!captionOn;$('captions').textContent=captionOn?'字幕開啟':'字幕關閉';$('captions').setAttribute('aria-pressed',String(captionOn));draw()};
$('target').onchange=()=>{target=$('target').value;draw()};
$('goto-layers').onclick=()=>{pause();const s=project.variants[locale].scenes.find(x=>x.id==='s05'),b=s.phases.find(p=>p.name==='b9');seekToFrame(((b?b.end:s.end)-0.2)*project.fps)};
addEventListener('keydown',e=>{if(e.target.closest('select,input'))return;if(e.key===' '){e.preventDefault();playing?pause():play()}else if(e.key==='ArrowRight'){pause();seekToFrame(frame+5*project.fps)}else if(e.key==='ArrowLeft'){pause();seekToFrame(frame-5*project.fps)}});
addEventListener('resize',scale);
</script>
